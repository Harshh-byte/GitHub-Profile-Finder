<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-white">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col items-center justify-start px-4 py-12">

  <!-- Header -->
  <header class="w-full max-w-2xl text-center mb-12">
    <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-white mb-2">GitHub Profile Finder</h1>
    <p class="text-gray-400 text-lg">Search for any GitHub user and see their profile instantly.</p>
  </header>

  <!-- Search Form -->
  <section class="w-full max-w-xl">
    <div class="flex items-center gap-4 bg-gray-800 p-4 rounded-2xl shadow-lg">
      <input type="text" placeholder="Enter GitHub username..."
        class="username-input flex-grow bg-transparent text-white placeholder-gray-400 border-none focus:outline-none" />
      <button
        class="search bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-xl transition-all duration-300">
        Search
      </button>
    </div>
  </section>

  <!-- Profile Card (with Dummy Data) -->
  <section class="mt-12 w-full max-w-3xl">
    <div
      class="card bg-gray-900 p-6 rounded-2xl shadow-2xl flex flex-col md:flex-row gap-6 items-center md:items-start">


    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
