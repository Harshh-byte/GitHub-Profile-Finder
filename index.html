<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Profile Finder</title>
    <meta name="title" content="GitHub Profile Finder" />
    <meta
      name="description"
      content="Search any GitHub username and get a crisp snapshot of profile details and recently updated repositories."
    />
    <link
      rel="canonical"
      href="https://github-profile-finder-hki0.onrender.com/"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitHub Profile Finder" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:url"
      content="https://github-profile-finder-hki0.onrender.com/"
    />
    <meta property="og:title" content="GitHub Profile Finder" />
    <meta
      property="og:description"
      content="Search any GitHub username and get a crisp snapshot of profile details and recently updated repositories."
    />
    <meta
      property="og:image"
      content="https://github-profile-finder-hki0.onrender.com/Assets/preview.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://github-profile-finder-hki0.onrender.com/Assets/preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://github-profile-finder-hki0.onrender.com/"
    />
    <meta name="twitter:site" content="@github" />
    <meta property="twitter:title" content="GitHub Profile Finder" />
    <meta
      property="twitter:description"
      content="Search any GitHub username and get a crisp snapshot of profile details and recently updated repositories."
    />
    <meta
      property="twitter:image"
      content="https://github-profile-finder-hki0.onrender.com/Assets/preview.jpg"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://github-profile-finder-hki0.onrender.com/Assets/github.svg"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="grid-accent px-4 py-8 sm:px-6 sm:py-10 md:px-10 md:py-12">
    <main class="mx-auto flex w-full max-w-6xl flex-col gap-8 md:gap-10">
      <header
        class="reveal-up relative overflow-hidden rounded-3xl border border-slate-900/10 bg-white/60 px-6 py-7 shadow-xl sm:px-8 sm:py-9 md:px-10"
      >
        <div
          class="absolute -left-14 top-6 h-28 w-28 rounded-full bg-amber-400/40 blur-2xl"
        ></div>
        <div
          class="absolute -right-14 bottom-4 h-28 w-28 rounded-full bg-teal-300/50 blur-2xl"
        ></div>
        <p
          class="relative inline-flex items-center gap-2 rounded-full border border-slate-900/15 bg-white/85 px-4 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-slate-700"
        >
          Discover GitHub talent
        </p>
        <h1
          class="hero-title relative mt-4 text-4xl font-bold leading-tight text-slate-900 sm:text-5xl"
        >
          GitHub Profile Finder
        </h1>
        <p class="relative mt-3 max-w-2xl text-sm text-slate-700 sm:text-base">
          Search any GitHub username and get a crisp snapshot of profile details
          and recently updated repositories.
        </p>
      </header>

      <section class="reveal-up reveal-delay-1">
        <div class="soft-card pulse-ring relative rounded-2xl p-3 sm:p-4">
          <div class="flex flex-col gap-3 sm:flex-row">
            <input
              type="text"
              placeholder="Try: octocat"
              class="username-input h-14 w-full rounded-xl border border-slate-900/15 bg-white/80 px-4 text-slate-900 placeholder-slate-400 outline-none transition focus:border-teal-500 focus:ring-4 focus:ring-teal-100"
            />
            <button
              class="search h-14 shrink-0 rounded-xl bg-slate-900 px-8 text-sm font-semibold uppercase tracking-wide text-white transition hover:bg-slate-800"
            >
              Search Profile
            </button>
          </div>
        </div>
      </section>

      <section class="reveal-up reveal-delay-2 flex flex-col gap-5">
        <div
          class="card hidden soft-card rounded-3xl p-5 sm:p-7 md:p-8 transition-all duration-300"
        ></div>
        <div
          class="repo-container grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </section>
    </main>

    <footer
      class="mx-auto w-full max-w-6xl border-t border-slate-900/10 mt-12 pt-8 pb-4 text-center text-sm text-slate-600"
    >
      <p>&copy; {currentYear} GitHub Profile Finder. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
