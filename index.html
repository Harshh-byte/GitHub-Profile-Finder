<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-white">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="github.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-start px-4 py-12 bg-gradient-to-br from-gray-900 via-gray-950 to-black">

  <!-- Header -->
  <header class="w-full max-w-2xl text-center mb-12 fade-in">
    <h1 class="text-5xl font-bold tracking-tight text-white mb-2">GitHub Profile Finder</h1>
    <p class="text-gray-400 text-lg">Search for any GitHub user and see their profile instantly.</p>
  </header>

  <!-- Search Form -->
  <section class="w-full max-w-xl fade-in">
    <div class="flex items-center gap-4 glass p-4 rounded-2xl shadow-lg">
      <input
        type="text"
        placeholder="Enter GitHub username..."
        class="username-input flex-grow bg-transparent text-white placeholder-gray-400 border-none focus:outline-none"
      />
      <button
        class="search bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl transition-all duration-300">
        Search
      </button>
    </div>
  </section>

  <!-- Profile Card -->
  <section class="mt-12 w-full max-w-4xl fade-in">
    <div
      class="card hidden glass p-6 rounded-2xl shadow-2xl flex flex-col md:flex-row gap-6 items-center md:items-start transition-all duration-300">
      <!-- profile content injected via JS -->
    </div>
  </section>

  <!-- Repos -->
  <section class="mt-10 w-full max-w-4xl fade-in">
<div class="repo-container grid sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Repos content injected via JS -->
    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
